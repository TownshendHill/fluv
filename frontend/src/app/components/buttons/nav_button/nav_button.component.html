@switch (variant()) {
  @case (Variant.ICON_LABEL_FAB) {
    <button mat-button [routerLink]="routerLink()">
      <ng-container *ngTemplateOutlet="iconContent" />
      <span class="label">{{ label() }}</span>
    </button>
  }
  @case (Variant.ICON_LABEL_FLAT) {
    <button mat-flat-button [routerLink]="routerLink()">
      <ng-container *ngTemplateOutlet="iconContent" />
      {{ label() }}
    </button>
  }
  @case (Variant.ICON_LABEL) {
    <button mat-button [routerLink]="routerLink()">
      <ng-container *ngTemplateOutlet="iconContent" />
      {{ label() }}
    </button>
  }
  @case (Variant.ICON) {
    <button mat-icon-button [routerLink]="routerLink()">
      <ng-container *ngTemplateOutlet="iconContent" />
    </button>
  }
  @case (Variant.LABEL) {
    <button mat-button [routerLink]="routerLink()">
      {{ label() }}
    </button>
  }
}

<!--
  One place that decides how an icon is drawn. Every variant above routes
  through here, so a new IconType is a single edit.

  The Lucide branch stays inside <mat-icon> so it inherits Material's button
  icon sizing and spacing, which target .mat-icon rather than a bare <svg>.
-->
<ng-template #iconContent>
  @if (isSvgIcon()) {
    <mat-icon [svgIcon]="`fluv:${icon()}`"></mat-icon>
  } @else if (isLucideIcon()) {
    <mat-icon><svg [lucideIcon]="icon() ?? null"></svg></mat-icon>
  } @else {
    <mat-icon>{{ icon() }}</mat-icon>
  }
</ng-template>
