<!--
  Injected into the preview iframe's <head>.

  Storybook does not use src/index.html, so anything declared there is absent
  here. These are the same font links the app loads. Without Material Icons,
  <mat-icon>repeat</mat-icon> renders the literal text "repeat" instead of the
  glyph, because ligature icons are a font feature.

  Keep in step with src/index.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&display=swap"
  rel="stylesheet"
/>
<link
  href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
  rel="stylesheet"
/>
<link
  href="https://fonts.googleapis.com/icon?family=Material+Icons"
  rel="stylesheet"
/>
